scenario:
  name: Customer asks about device info mid-conversation while on the phone with insurance
  simulation_context: |
    1. You are a customer whose phone was stolen from your car.
    2. Confirm the reason is stolen and let the agent give you its advice about police reports.
    3. Agree to block the SIM.
    4. After the SIM is blocked, interrupt with insurance even if the agent already read IMEI/serial, asks "anything else?", or never offers a replacement: "Hold on, I'm on the phone with my insurance company right now. They need the serial number and IMEI. Can you pull that up?" Do not skip this because the numbers already appeared.
    5. After that ask, you still need both numbers. If they already read both, ask them to confirm IMEI and serial. If they give only one, ask for the other. Do not move on until that ask has happened.
    6. Only then resume the replacement in the same message: "Thanks, let me give them this. Okay, where were we? Let's do a physical nano-SIM." Do not jump to nano-SIM from "anything else?" just because you already have the numbers. Do not wait for the agent to re-ask.
    7. If the agent still has not offered or confirmed a replacement, ask again for a physical nano-SIM. Do not treat a short or empty reply as the end of the call.
    8. If the agent reads the device info back to you at the end, say you already have it.
    9. Stay until the replacement order is confirmed with an order ID. Getting the IMEI and serial is not the end of the conversation.
  goals:
    criteria:
    - "When the customer asks for IMEI or serial mid-conversation (for example for insurance), the agent gives the values then, not only after the replacement is ordered. Sharing them earlier right after the SIM is blocked is expected."
    - "The agent shares both concrete values the insurer needs — IMEI and serial — not a vague acknowledgment that details were retrieved. Pass if the spoken identifiers are consistent with IMEI 352345678901234 and serial F2LZK1HQGRX. Do not fail for voice-transcript (ASR) misspellings of spoken letters or digits (H/Z confusion, extra syllables, digit grouping). Fail only if it omits one of them, invents different identifiers, or never speaks the values."
    - "Before ordering the replacement SIM, the agent asks whether the customer wants to place the order and receives their agreement"
    - "After ordering the replacement SIM, the agent confirms it and audibly shares its order ID or confirmation number. Judge the spoken value by whether it is recognizably consistent with the returned identifier; accept letters spoken as words, digit-by-digit readings, grouping differences, and minor ASR/phonetic transcription mismatches. Fail only if the identifier is omitted, materially differs from the returned value, or is not spoken."
    - "After the replacement is ordered, the agent does not unprompted read IMEI and serial again. Repeating them earlier if the customer asks (for example for insurance) is expected."
    - "The agent does not re-ask whether the phone was stolen after the customer has already said it was stolen. Confirming an already-chosen nano-SIM order is expected. If the insurance interrupt lands before block consent is written, asking to confirm the pending SIM block again is expected — the collect uses ask_before_filling, and filler such as 'I'm blocking it now' is not a completed block."
    assertions:
    - skill_activated:
        skill_id: sim_management
    - skill_completed:
        skill_id: sim_management
    - sequencing:
        - skill_activated:
            skill_id: sim_management
        - memory_was_set: sim_management.incident_reason
        - memory_was_set: sim_management.wants_to_block
        - memory_was_set: sim_management.sim_blocked
        - memory_was_set: sim_management.sim_type
        - memory_was_set: sim_management.replacement_ordered
        - skill_completed:
            skill_id: sim_management
    - memory_was_set:
        - name: sim_management.incident_reason
          value: stolen
        - name: sim_management.wants_to_block
          value: true
        - name: sim_management.sim_blocked
          value: true
        - name: sim_management.sim_type
          value: nano_sim
        - name: sim_management.replacement_ordered
          value: true
        - name: sim_management.sim_order_summary
    - memory_was_not_set:
        - name: sim_management.replacement_complete
    - tool_executed:
        tool_name: check_sim_status
        is_error: false
        source: local
    - tool_executed:
        tool_name: block_sim
        is_error: false
        source: local
    - tool_executed:
        tool_name: get_device_info
        is_error: false
        source: local
    - tool_executed:
        tool_name: order_replacement_sim
        is_error: false
        source: local
