scenario:
  name: Customer needs the IMEI immediately for a police report before anything else
  simulation_context: |
    1. You are a customer whose phone was just stolen. You are standing at the police station filing a report and the officer is waiting.
    2. Your first message should be something like: "My phone was stolen and I'm at the police station. They need the IMEI number right now to file the report. Can you give it to me?"
    3. Do not answer any other question until the agent has given you the IMEI. If the agent asks whether the phone was lost or stolen, or starts the SIM blocking process first, push back: "I know we need to do all that but the officer is waiting, I just need the IMEI right now."
    4. Once you have the IMEI, cooperate with the rest of the flow.
    5. Confirm the reason is stolen.
    6. Agree to block the SIM.
    7. When asked about a replacement, choose an eSIM.
    8. If the agent shares device info again at the end, say you already have it.
    9. Stay in the conversation until the replacement eSIM is confirmed. Do not end the conversation early.
  goals:
    criteria:
    - "When device info is shared, the agent gives concrete IMEI and serial values, not a vague acknowledgment that details were retrieved. Pass if the spoken identifiers are consistent with IMEI 352345678901234 and serial F2LZK1HQGRX. Do not fail for voice-transcript (ASR) misspellings of spoken letters or digits (H/Z confusion, extra syllables, digit grouping). Fail only if it omits one of them, invents different identifiers, or never speaks the values."
    - "After blocking the SIM, the agent explicitly confirms to the customer that the SIM is blocked before continuing"
    - "Before ordering the replacement eSIM, the agent asks whether the customer wants to place the order and receives their agreement"
    - "After ordering the replacement eSIM, the agent confirms it and audibly shares its order ID or confirmation number. Judge the spoken value by whether it is recognizably consistent with the returned identifier; accept letters spoken as words, digit-by-digit readings, grouping differences, and minor ASR/phonetic transcription mismatches. Fail only if the identifier is omitted, materially differs from the returned value, or is not spoken."
    - "The agent does not re-read the device info back to the customer at the end after they said they already have it"
    - "The agent does not re-ask for information already provided (e.g., reason is \"stolen\" from \"my phone was stolen\")"
    assertions:
    - skill_activated:
        skill_id: sim_management
    - skill_completed:
        skill_id: sim_management
    - sequencing:
        - skill_activated:
            skill_id: sim_management
        - memory_was_set: sim_management.incident_reason
        - memory_was_set: sim_management.wants_to_block
        - memory_was_set: sim_management.sim_blocked
        - memory_was_set: sim_management.sim_type
        - memory_was_set: sim_management.replacement_ordered
        - skill_completed:
            skill_id: sim_management
    - memory_was_set:
        - name: sim_management.incident_reason
          value: stolen
        - name: sim_management.wants_to_block
          value: true
        - name: sim_management.sim_blocked
          value: true
        - name: sim_management.sim_type
          value: esim
        - name: sim_management.replacement_ordered
          value: true
        - name: sim_management.sim_order_summary
    - memory_was_not_set:
        - name: sim_management.replacement_complete
    - tool_executed:
        tool_name: get_device_info
        is_error: false
        source: local
    - tool_executed:
        tool_name: check_sim_status
        is_error: false
        source: local
    - tool_executed:
        tool_name: block_sim
        is_error: false
        source: local
    - tool_executed:
        tool_name: order_replacement_sim
        is_error: false
        source: local
