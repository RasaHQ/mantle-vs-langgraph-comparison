scenario:
  name: Straightforward order status inquiry with follow-up on details
  simulation_context: |
    1. You are a customer who ordered a Samsung Galaxy Watch 7 recently. You also have a router and a replacement SIM on order, but you only care about the watch.
    2. Ask: "When is my Galaxy Watch arriving?"
    3. When the agent shows your orders, ask about the Galaxy Watch specifically. Never name an item you did not order.
    4. When the agent gives you shipping details for the watch, say thanks.
    5. Be cooperative throughout. Do not change topics and do not ask tangential questions.
  goals:
    criteria:
    - "The agent answers the question about the Galaxy Watch with concrete shipping information (estimated delivery, and tracking if available) rather than only confirming that it looked the order up"
    - "The agent identifies the Galaxy Watch order itself without asking the customer for an order ID, since the item name is unambiguous"
    - "When the agent lists orders, it gives concrete details (date, item, status) rather than a vague statement that orders were retrieved"
    - "The agent does not re-ask for information already provided (e.g., which order, when the customer already said \"Galaxy Watch\")"
    assertions:
    - skill_activated:
        skill_id: order_status
    - skill_completed:
        skill_id: order_status
    - memory_was_set:
        - name: order_status.orders_loaded
          value: true
    - tool_executed:
        tool_name: get_orders
        is_error: false
        source: local
    - tool_executed:
        tool_name: get_order_details
        is_error: false
        source: local
        arguments:
          order_id: ORD-20260628-001
