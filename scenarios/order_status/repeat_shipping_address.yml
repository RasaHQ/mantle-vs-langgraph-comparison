scenario:
  name: Customer asks for the shipping address the agent already shared moments ago
  simulation_context: |
    1. You are a customer who ordered a Samsung Galaxy Watch 7.
    2. Ask: "When is my Galaxy Watch arriving?"
    3. When the agent shows your orders, ask for the details on the Galaxy Watch order.
    4. When the agent gives you shipping info including the address, acknowledge it.
    5. Say: "No more questions, all good then."
    6. Wait for the agent to wrap up, then say: "Oh wait, remind me the shipping address on it again?"
    7. If the agent says it does not have access or cannot retrieve that, push back: "You just told me this 2 minutes ago!"
    8. If it still cannot help, say you are frustrated. Do not end the conversation until you either get the address again or the agent has clearly refused.
  goals:
    criteria:
    - "The agent provides a shipping address again when asked the second time. Note, this is a voice transcription, so the details are likely to be mis-transcribed and might not be the same as the first mention. Fail only if it refuses or misses the question."
    - "The agent does not claim it has lost access to data or tools it used moments ago"
    - "The agent does not make the customer sit through a full re-listing of every order to answer a follow-up about the order they were just discussing"
    - "The agent does not re-ask for information already provided (e.g., which order, when the customer already said \"Galaxy Watch\" and was just discussing it)"
    assertions:
    - skill_activated:
        skill_id: order_status
    - skill_completed:
        skill_id: order_status
    - memory_was_set:
        - name: order_status.orders_loaded
          value: true
    - tool_executed:
        tool_name: get_orders
        is_error: false
        source: local
    - tool_executed:
        tool_name: get_order_details
        is_error: false
        source: local
        arguments:
          order_id: ORD-20260628-001
