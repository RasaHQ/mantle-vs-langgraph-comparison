scenario:
  name: Current mobile bill inquiry
  simulation_context: |
    1. You are a customer who wants to know the total and due date of your current mobile phone bill.
    2. Ask: "How much is my current phone bill, and when is it due?"
    3. After the agent gives you both details, say thanks.
    4. Be cooperative and do not ask about bank accounts, cards, orders, shipments, or SIM replacement.
  goals:
    criteria:
    - "The agent reports that the current June 2026 mobile bill is $142.50"
    - "The agent reports that the bill is due on July 15, 2026"
    - "The agent does not invent bill values or ask irrelevant questions about bank accounts, cards, orders, shipments, or SIM replacement"
    assertions:
    - skill_activated:
        skill_id: bill_inquiry
    - skill_completed:
        skill_id: bill_inquiry
    - tool_executed:
        tool_name: get_current_bill
        is_error: false
        source: mcp
        mcp_server: mock_tools
