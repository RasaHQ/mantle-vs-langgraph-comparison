scenario:
  name: Damaged card replacement follows the damaged path without a fraud review
  simulation_context: |
    1. You are a customer whose River Visa ending 4821 is physically damaged — your dog chewed it up. You also have a Summit Rewards card on file, which is fine. Nothing was lost or stolen and you have no fraud concerns whatsoever.
    2. Regardless of how the agent greets you, state once that your dog chewed up your River Visa and you need a replacement, then follow the agent's lead.
    3. When asked for the reason, say the card is damaged — your dog ate it. Never say it was lost or stolen.
    4. When the agent notes there is an authorized user (Mike Chen) on the card and asks who needs a replacement, say just you, not the authorized user.
    5. When asked about a digital wallet, accept and say Apple Pay.
    6. Choose standard shipping.
    7. Confirm the order when the agent asks.
    8. Stay in the conversation until the agent has told you the replacement order was placed. Do not end the conversation early and do not change your mind about anything.
  goals:
    criteria:
    - "Before provisioning a digital wallet, the agent asks whether the customer wants to add the new card to Apple Pay or Google Pay and receives their agreement"
    - "Before placing the replacement order, the agent asks whether the customer wants to place the order and receives their agreement"
    - "After placing the replacement order, the agent confirms it and audibly shares the order ID from the tool result. Judge the spoken value by whether it is recognizably consistent with the returned identifier; accept letters spoken as words, digit-by-digit readings, grouping differences, and minor ASR/phonetic transcription mismatches. Fail only if the ID is omitted, materially differs from the returned value, or is not spoken."
    - "The agent does not re-ask which card to replace or why it needs replacing after the customer has already named the River Visa and said it is damaged. A brief confirmation of that already-named card is not a re-ask. Asking the customer to choose between the cards on the account is a re-ask. Asking for shipping speed or confirming the order is not a re-ask of those facts."
    assertions:
    - skill_activated:
        skill_id: card_replace
    - skill_activated:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_replace
    - sequencing:
        - skill_activated:
            skill_id: card_replace
        - memory_was_set: card_replace.account_eligible
        - skill_activated:
            skill_id: card_disambiguate
        - skill_completed:
            skill_id: card_disambiguate
        - memory_was_set: card_replace.card_eligible
        - memory_was_set: card_replace.has_authorized_users
        - memory_was_set: card_replace.wallet_provisioned
        - memory_was_set: card_replace.shipping_type
        - memory_was_set: card_replace.replacement_ordered
        - skill_completed:
            skill_id: card_replace
    - memory_was_set:
        - name: card_replace.account_eligible
          value: true
        - name: card_replace.replacement_reason
          value: damaged
        - name: card_disambiguate.selected_card_id
          value: VISA_001
        - name: card_disambiguate.selected_card_label
          value: River Visa ending 4821
        - name: card_replace.card_eligible
          value: true
        - name: card_replace.has_authorized_users
          value: true
        - name: card_replace.replace_target
          value: customer
        - name: card_replace.damaged_applied
          value: true
        - name: card_replace.wallet_eligible
          value: true
        - name: card_replace.wallet_already_provisioned
          value: false
        - name: card_replace.wallet_consent
          value: true
        - name: card_replace.wallet_provider
          value: apple_pay
        - name: card_replace.wallet_provisioned
          value: true
        - name: card_replace.shipping_type
          value: standard
        - name: card_replace.replacement_ordered
          value: true
    - memory_was_not_set:
        - name: card_replace.transaction_review_complete
        - name: card_replace.transactions_look_familiar
        - name: card_replace.fraud_reported
        - name: card_replace.card_locked
        - name: card_replace.wants_card_locked
        - name: card_replace.recent_transactions
    - tool_executed:
        tool_name: check_account_eligibility
        is_error: false
        source: local
    - tool_executed:
        tool_name: get_customer_cards
        is_error: false
        source: local
    - tool_executed:
        tool_name: check_card_eligibility
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: check_damaged_replacement_scope
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: check_wallet_eligibility_and_status
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: provision_digital_wallet
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
          wallet_provider: apple_pay
    - tool_executed:
        tool_name: check_rush_shipping_eligibility
        is_error: false
