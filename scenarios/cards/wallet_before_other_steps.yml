scenario:
  name: Customer in a hurry demands digital wallet before completing any other steps
  simulation_context: |
    1. You are a customer travelling abroad who lost your River Visa ending 4821. You also have a Summit Rewards card on file, but it is at home and no use to you right now.
    2. Your first message should be something like: "I lost my River Visa while travelling and I'm stuck abroad with no way to pay. Can you set up Apple Pay for it immediately? I need to buy food tonight."
    3. Until the agent has actually set up Apple Pay, do not cooperate with any other step. If it tries to walk you through a transaction review or a card lock first, refuse and get increasingly frustrated: "I don't care about the transactions right now, I need Apple Pay!" and "Can you please just do the wallet first?" Saying it understands the urgency is not enough — do not move on until the wallet is actually done. That refusal is only about order of steps; it is not a fraud report and it is not a verdict that the charges look unfamiliar.
    4. Once the agent says it is adding or has added the card to Apple Pay, cooperate with the remaining replacement steps. Do not keep refusing the fraud review after the wallet is done.
    5. When the agent asks whether the recent charges look familiar — including if it already showed the list before the wallet and asks again after — say they all look familiar. Never describe them as unfamiliar or ask to report fraud.
    6. Agree to lock the card when asked.
    7. Choose rush shipping.
    8. Confirm the order.
    9. Stay in the conversation until the replacement order is confirmed. Do not end the conversation early.
  goals:
    criteria:
    - "The agent asks the customer to confirm before locking the card, rather than locking it unprompted"
    - "The agent confirms Apple Pay or asks about adding the card to a digital wallet before provisioning it. If the customer already asked to add the card to a named wallet, that request counts as confirmation — do not require a second would-you-like-to-add ask."
    - "Before placing the replacement order, the agent asks whether the customer wants to place the order and receives their agreement"
    - "After placing the replacement order, the agent confirms it and audibly shares the order ID from the tool result. Judge the spoken value by whether it is recognizably consistent with the returned identifier; accept letters spoken as words, digit-by-digit readings, grouping differences, and minor ASR/phonetic transcription mismatches. Fail only if the ID is omitted, materially differs from the returned value, or is not spoken."
    - "The agent does not re-ask which card to replace or why it needs replacing after the customer has already named the River Visa and said it is lost. Asking for shipping speed or confirming the order is not a re-ask of those facts."
    assertions:
    - skill_activated:
        skill_id: card_replace
    - skill_activated:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_replace
    - sequencing:
        - skill_activated:
            skill_id: card_replace
        - memory_was_set: card_replace.account_eligible
        - skill_activated:
            skill_id: card_disambiguate
        - skill_completed:
            skill_id: card_disambiguate
        - memory_was_set: card_replace.card_eligible
        - memory_was_set: card_replace.transactions_look_familiar
        - memory_was_set: card_replace.card_locked
        - memory_was_set: card_replace.shipping_type
        - memory_was_set: card_replace.replacement_ordered
        - skill_completed:
            skill_id: card_replace
    - memory_was_set:
        - name: card_replace.account_eligible
          value: true
        - name: card_replace.replacement_reason
          value: lost
        - name: card_disambiguate.selected_card_id
          value: VISA_001
        - name: card_disambiguate.selected_card_label
          value: River Visa ending 4821
        - name: card_replace.card_eligible
          value: true
        - name: card_replace.recent_transactions
        - name: card_replace.transaction_review_complete
          value: true
        - name: card_replace.transactions_look_familiar
          value: true
        - name: card_replace.wants_card_locked
          value: true
        - name: card_replace.card_locked
          value: true
        - name: card_replace.wallet_eligible
          value: true
        - name: card_replace.wallet_already_provisioned
          value: false
        - name: card_replace.wallet_consent
          value: true
        - name: card_replace.wallet_provider
          value: apple_pay
        - name: card_replace.wallet_provisioned
          value: true
        - name: card_replace.shipping_type
          value: rush
        - name: card_replace.replacement_ordered
          value: true
    - memory_was_not_set:
        - name: card_replace.fraud_reported
        - name: card_replace.has_authorized_users
        - name: card_replace.replace_target
        - name: card_replace.damaged_applied
    - tool_executed:
        tool_name: check_account_eligibility
        is_error: false
        source: local
    - tool_executed:
        tool_name: get_customer_cards
        is_error: false
        source: local
    - tool_executed:
