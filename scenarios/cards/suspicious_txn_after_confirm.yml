scenario:
  name: Customer flags a suspicious transaction after already confirming they all looked fine
  simulation_context: |
    1. You are a customer who lost their River Visa ending 4821 on the bus. You also have a Summit Rewards card on file.
    2. Regardless of how the agent greets you, state once that you lost your River Visa ending 4821 on the bus and need a replacement, then follow the agent's lead.
    3. When the agent shows you recent transactions for a fraud review, say they all look familiar.
    4. Cooperate through the lock step — agree to lock the card.
    5. After the lock is done, you MUST raise the Amazon concern before you agree to a digital wallet, pick shipping, or confirm an order. Say: "Wait, did you say someone used that card on Amazon yesterday?" If the agent never asks about a wallet and jumps to shipping, interrupt with that Amazon line before you accept any shipping option.
    6. Do not answer the wallet question, choose shipping, or confirm an order until the agent has actually looked into the Amazon charge and told you concrete details (what it was, the amount, or the date). If it ignores you, re-asks about wallets, or tries to finish the order, push back: "I'm not talking about wallets or shipping right now, I need you to check that Amazon charge."
    7. Once the agent has given you the details of the Amazon charge, say that explains it and then follow the agent. If they ask about a digital wallet, decline. If they ask shipping, pick standard. If they ask to place the order, confirm. Do not mention wallet or shipping until they ask.
    8. Stay in the conversation until the replacement order is confirmed. Do not end the conversation early, and do not skip the Amazon beat.
  goals:
    criteria:
    - "The agent looks into the Amazon charge and tells the customer concrete details about it (what it was, the amount, or the date) even though the fraud review step was already finished"
    - "Before locking the lost card, the agent asks whether the customer wants it locked and receives their agreement"
    - "After locking the card, the agent explicitly confirms to the customer that the card is locked before continuing"
    - "The agent asks whether the customer wants to add the new card to a digital wallet (Apple Pay or Google Pay) before moving on to shipping"
    - "Before placing the replacement order, the agent asks whether the customer wants to place the order and receives their agreement"
    - "After placing the replacement order, the agent confirms it and audibly shares the order ID from the tool result. Judge the spoken value by whether it is recognizably consistent with the returned identifier; accept letters spoken as words, digit-by-digit readings, grouping differences, and minor ASR/phonetic transcription mismatches. Fail only if the ID is omitted, materially differs from the returned value, or is not spoken."
    - "The agent does not re-ask which card to replace or why it needs replacing after the customer has already named the River Visa and said it is lost. Asking for shipping speed or confirming the order is not a re-ask of those facts."
    assertions:
    - skill_activated:
        skill_id: card_replace
    - skill_activated:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_replace
    - sequencing:
        - skill_activated:
            skill_id: card_replace
        - memory_was_set: card_replace.account_eligible
        - skill_activated:
            skill_id: card_disambiguate
        - skill_completed:
            skill_id: card_disambiguate
        - memory_was_set: card_replace.card_eligible
        - memory_was_set: card_replace.transactions_look_familiar
        - memory_was_set: card_replace.card_locked
        - memory_was_set: card_replace.shipping_type
        - memory_was_set: card_replace.replacement_ordered
        - skill_completed:
            skill_id: card_replace
    - memory_was_set:
        - name: card_replace.account_eligible
          value: true
        - name: card_replace.replacement_reason
          value: lost
        - name: card_disambiguate.selected_card_id
          value: VISA_001
        - name: card_disambiguate.selected_card_label
          value: River Visa ending 4821
        - name: card_replace.card_eligible
          value: true
        - name: card_replace.recent_transactions
        - name: card_replace.transaction_review_complete
          value: true
        - name: card_replace.transactions_look_familiar
          value: true
        - name: card_replace.wants_card_locked
          value: true
        - name: card_replace.card_locked
          value: true
        - name: card_replace.wallet_eligible
          value: true
        - name: card_replace.wallet_already_provisioned
          value: false
        - name: card_replace.shipping_type
          value: standard
        - name: card_replace.replacement_ordered
          value: true
    - memory_was_not_set:
        - name: card_replace.fraud_reported
        - name: card_replace.wallet_consent
        - name: card_replace.wallet_provider
        - name: card_replace.wallet_provisioned
        - name: card_replace.has_authorized_users
        - name: card_replace.replace_target
        - name: card_replace.damaged_applied
    - tool_executed:
        tool_name: check_account_eligibility
        is_error: false
        source: local
    - tool_executed:
        tool_name: get_customer_cards
        is_error: false
        source: local
    - tool_executed:
        tool_name: check_card_eligibility
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: load_recent_transactions
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: get_transaction_details
        is_error: false
        source: local
        arguments:
          transaction_id: txn_001
    - tool_executed:
        tool_name: lock_card
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: check_wallet_eligibility_and_status
        is_error: false
        source: local
