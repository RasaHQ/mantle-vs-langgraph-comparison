scenario:
  name: Found card mid-flow — cancel pending actions
  simulation_context: |
    1. Call because you think your River Visa ending 4821 is lost. Confirm the reason is lost and the card is the River Visa.
    2. After that, wait. Naming the card ("Got it, River Visa") is not a question. Do not say yes to it, and do not mention a lock until the agent asks whether to lock that card.
    3. Say the charges look familiar only after the agent has listed specific charges and asked whether they look familiar. If no charges have been listed, do not say they look familiar. Do not invent a charge.
    4. Agree to a lock only after the agent has listed specific charges, you have said they look familiar, and the agent then asks whether to lock the card. If it asks to lock before that, say you are still waiting to see the charges. Do not ask the agent to lock it.
    5. Do not accept a digital wallet, a shipping choice, or a replacement order on this call. If the agent offers one before the card is locked, say you are still waiting to see the charges.
    6. If the agent says it cannot show the charges or lock the card in this chat, say you want that done here and wait. Do not say "I'll stop here", do not say "please cancel and close it", and do not switch to support.
    7. Only after the agent says the card is already locked, in the past tense (for example "your card is now locked"), say: "Wait — I just found it under the seat. Don't order a replacement, don't do anything else." Do not say this when the agent only offers a lock or says it will lock the card.
    8. Then ask: "Did you already do anything to the card?"
    9. Then, regardless of the agent's response, ask what can and cannot be reversed.
    10. Do not authorize any new action after you find the card. If the agent asks whether to pick the replacement back up or stop, say to stop it. Do not say you are done, and do not say you will contact support yourself, until the agent confirms it has stopped.
  goals:
    criteria:
    - "The agent accurately states whether any action had already completed rather than guessing"
    - "When the customer asks what can be reversed, the agent does not offer to unlock the card and does not say the lock can be undone from this chat. Saying it cannot unlock the card, or that it has no way to undo the lock, passes."
    - "The agent does not perform any duplicate or compensating action the user did not request"
    assertions:
    - skill_activated:
        skill_id: card_replace
    - skill_activated:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_disambiguate
    - skill_cancelled:
        skill_id: card_replace
    - sequencing:
        - skill_activated:
            skill_id: card_replace
        - memory_was_set: card_replace.account_eligible
        - skill_activated:
            skill_id: card_disambiguate
        - skill_completed:
            skill_id: card_disambiguate
        - memory_was_set: card_replace.card_eligible
        - memory_was_set: card_replace.transactions_look_familiar
        - memory_was_set: card_replace.card_locked
    - memory_was_set:
        - name: card_replace.account_eligible
          value: true
        - name: card_replace.replacement_reason
          value: lost
        - name: card_disambiguate.selected_card_id
          value: VISA_001
        - name: card_disambiguate.selected_card_label
          value: River Visa ending 4821
        - name: card_replace.card_eligible
          value: true
        - name: card_replace.transaction_review_complete
          value: true
        - name: card_replace.transactions_look_familiar
          value: true
        - name: card_replace.wants_card_locked
          value: true
        - name: card_replace.card_locked
          value: true
    - memory_was_not_set:
        - name: card_replace.wallet_consent
        - name: card_replace.wallet_provider
        - name: card_replace.wallet_provisioned
        - name: card_replace.shipping_type
        - name: card_replace.replacement_ordered
    - tool_executed:
        tool_name: check_card_eligibility
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: load_recent_transactions
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: lock_card
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
