scenario:
  name: Customer demands immediate card lock before anything else due to active fraud
  simulation_context: |
    1. You are a panicked customer. You just got a notification that someone withdrew $500 from an ATM using your card. You have two cards on file: the River Visa ending 4821 and a Summit Rewards card.
    2. Your first message should be something like: "Someone is using my card right now at an ATM! I need you to lock it immediately!"
    3. When the agent asks which card to lock, tell it right away: your River Visa.
    4. Until the agent has confirmed the River card is locked, do not answer any other question. If it tries to collect the replacement reason, run eligibility, or start a transaction review first, push back and insist it lock the River card now.
    5. Once the agent confirms the card is locked, cooperate normally.
    6. Say the card was stolen.
    7. Decline the digital wallet.
    8. Choose rush shipping.
    9. Confirm the order.
    10. Stay in the conversation until the replacement order is confirmed. Do not end the conversation early.
  goals:
    criteria:
    - "After locking the card, the agent explicitly confirms to the customer that the River card is locked (not only that a lock tool ran)"
    - "The agent asks whether the customer wants to add the new card to a digital wallet (Apple Pay or Google Pay)"
    - "Before placing the replacement order, the agent asks whether the customer wants to place the order and receives their agreement"
    - "After placing the replacement order, the agent confirms it and audibly shares the order ID from the tool result. Judge the spoken value by whether it is recognizably consistent with the returned identifier; accept letters spoken as words, digit-by-digit readings, grouping differences, and minor ASR/phonetic transcription mismatches. Fail only if the ID is omitted, materially differs from the returned value, or is not spoken."
    - "The agent does not re-ask which card to replace or why it needs replacing after the customer has already named the River Visa and said it was stolen. Asking for shipping speed or confirming the order with the selected shipping type is not a re-ask of those facts."
    assertions:
    - skill_activated:
        skill_id: card_replace
    - skill_activated:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_disambiguate
    - skill_completed:
        skill_id: card_replace
    - sequencing:
        - skill_activated:
            skill_id: card_replace
        - memory_was_set: card_replace.account_eligible
        - skill_activated:
            skill_id: card_disambiguate
        - skill_completed:
            skill_id: card_disambiguate
        - memory_was_set: card_replace.card_eligible
        - memory_was_set: card_replace.shipping_type
        - memory_was_set: card_replace.replacement_ordered
        - skill_completed:
            skill_id: card_replace
    - memory_was_set:
        - name: card_replace.account_eligible
          value: true
        - name: card_replace.replacement_reason
          value: stolen
        - name: card_disambiguate.selected_card_id
          value: VISA_001
        - name: card_disambiguate.selected_card_label
          value: River Visa ending 4821
        - name: card_replace.card_eligible
          value: true
        - name: card_replace.card_locked
          value: true
        - name: card_replace.wallet_eligible
          value: true
        - name: card_replace.wallet_already_provisioned
          value: false
        - name: card_replace.shipping_type
          value: rush
        - name: card_replace.replacement_ordered
          value: true
    - memory_was_not_set:
        - name: card_replace.recent_transactions
        - name: card_replace.transaction_review_complete
        - name: card_replace.transactions_look_familiar
        - name: card_replace.fraud_reported
        - name: card_replace.wants_card_locked
        - name: card_replace.wallet_consent
        - name: card_replace.wallet_provider
        - name: card_replace.wallet_provisioned
        - name: card_replace.has_authorized_users
        - name: card_replace.replace_target
        - name: card_replace.damaged_applied
    - tool_executed:
        tool_name: check_account_eligibility
        is_error: false
        source: local
    - tool_executed:
        tool_name: get_customer_cards
        is_error: false
        source: local
    - tool_executed:
        tool_name: check_card_eligibility
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: lock_card
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: check_wallet_eligibility_and_status
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: check_rush_shipping_eligibility
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
    - tool_executed:
        tool_name: process_card_replacement
        is_error: false
        source: local
        arguments:
          card_id: VISA_001
          shipping_type: rush
