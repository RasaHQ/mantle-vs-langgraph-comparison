# Fixed texts the agent speaks itself, without a model call. Placeholders are
# filled from the tool result or domain state when the text is spoken.

utter_greet: Hi! How can I help you today?

utter_continue_interrupted: >
  We were still in the middle of {task}. Would you like to continue with that,
  or drop it?

utter_decline_out_of_scope: >
  I'm not able to help with that here. For requests like this, contact Acme
  customer support through the Acme app or website. I can still help with
  cards, accounts, orders, SIMs, and bills.

utter_customer_cards_failed: >
  I couldn't retrieve your cards just now. Please try again in a moment.

utter_card_locked: >
  Your card has been locked. No further transactions will be authorized.

utter_confirm_order: >
  Alright, shall I go ahead and place the order with {shipping_type} shipping?

utter_order_cancelled: No problem, I haven't placed the order.

utter_card_replace_complete: >
  All set. Your replacement {card_label} has been ordered with {shipping_type}
  shipping. Your order ID is {order_id}, and it should arrive in {delivery}.

utter_sim_incident_advice_lost: >
  Check your account for unauthorized charges. You may be able to locate the
  device using Find My iPhone or Google Find My Device.

utter_sim_incident_advice_stolen: >
  Report the theft to the police. After the SIM is blocked, I will share the
  device details on file for your report. Check your account for any
  unauthorized charges.

utter_ask_block_sim: >
  This SIM is active. Do you want me to block it now to prevent any
  unauthorized use?

utter_sim_blocked: Your SIM is now blocked.

utter_sim_left_active: No problem, I'll leave the SIM active for now.

utter_confirm_sim_order: I'll order a {sim_name} replacement for you. Shall I go ahead?

utter_sim_order_cancelled: >
  No problem, I haven't ordered the replacement. Let me know if you change
  your mind.

utter_sim_order_replacement_success: >
  Your replacement {sim_name} is ordered. The order ID is {order_id} and the
  confirmation number is {confirmation}. Delivery: {delivery}. {next_step}

utter_sim_order_replacement_failed: >
  I wasn't able to place the replacement SIM order just now. Please try again
  in a moment, or I can help you retry.

# Spoken word for word: the customer needs both the IMEI and the serial number.
utter_device_info_shared: |
  Here are the device details on file for your line:
  Device: {device_name}
  IMEI: {device_imei}
  Serial number: {device_serial}
