model_groups:
  - id: orchestrator
    models:
      - provider: openai
        model: gpt-5.2
        api_base: https://api.openai.com/v1
        api_key: ${OPENAI_API_KEY}
        timeout: 30
        reasoning_effort: "none"
        cache:
          no-cache: true
  - id: reference_embeddings
    models:
      - provider: openai
        model: text-embedding-3-large
        api_base: https://api.openai.com/v1
        api_key: ${OPENAI_API_KEY}
  - id: voice_asr
    models:
      - provider: deepgram_flux
  - id: voice_tts
    models:
      - provider: cartesia

mcp_servers:
  - name: mock_tools
    url: http://localhost:8001/mcp/
    token: ${MCP_BANKING_TOKEN}

channels:
  rest: { enabled: true }
  inspector:
    enabled: true
    pause_after_filler: 0
    pause_between_messages: 0
