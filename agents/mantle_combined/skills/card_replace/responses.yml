responses:
  utter_ask_shipping_type:
    - text: >
        Would you like standard or rush shipping?
      metadata:
        rephrase: true

  utter_card_locked:
    - text: >
        Your {session.card_disambiguate.selected_card_label} has been locked. No
        further transactions will be authorized.
      metadata:
        rephrase: true

  utter_confirm_order:
    - text: >
        Alright, shall I go ahead
        and place the order with {session.card_replace.shipping_type} shipping?
      metadata:
        rephrase: true

  utter_order_cancelled:
    - text: >
        No problem — the order has been cancelled.
      metadata:
        rephrase: true

  utter_card_replace_complete:
    - text: |
        All set. Your replacement card has been ordered:
        {session.card_replace.replacement_order_summary}
