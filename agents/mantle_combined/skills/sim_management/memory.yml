schema:
  public:
    incident_reason:
      type: categorical
      enum_values: [lost, stolen]
      llm_settable: True
      description: >
        Whether the device or SIM was lost or stolen. Record this as soon
        as the customer states it. Do not ask again once it is set.
    sim_blocked:
      type: bool
    wants_to_block:
      type: bool
      llm_settable: True
      description: >
        The customer's consent to block the SIM. Do not infer it from
        other statements.
    replacement_ordered:
      type: bool
    replacement_complete:
      type: bool
    sim_type:
      type: categorical
      enum_values: [nano_sim, esim]
      llm_settable: true
      description: >
        The replacement SIM type explicitly chosen by the customer:
        nano_sim (physical card) or esim. Set this only when the customer
        clearly states which type they want. Do not infer it from device
        compatibility, prior context, or an agent recommendation.
    sim_order_summary:
      type: text
    device_info_shared:
      type: bool
    device_imei:
      type: text
    device_serial:
      type: text
    device_name:
      type: text
