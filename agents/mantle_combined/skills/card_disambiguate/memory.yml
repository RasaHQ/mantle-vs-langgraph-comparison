# Selection is skill-public so parent skills can read it after this digression
# completes (engine: other skills' public fields are in read_all).
schema:
  public:
    card_list:
      type: json
    selected_card_id:
      type: text
      description: The card ID from the card list (e.g. CARD_001).
      llm_settable: true
    selected_card_label:
      type: text
