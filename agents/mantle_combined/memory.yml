# Project memory: kept for the whole conversation, across skill runs.
# sim_management writes these so a later run of the skill knows what is done.
sim_blocked:
  type: bool
  mutable: true
  writable_by: [sim_management]
sim_device_info_shared:
  type: bool
  mutable: true
  writable_by: [sim_management]
sim_orders:
  type: text
  mutable: true
  writable_by: [sim_management]
